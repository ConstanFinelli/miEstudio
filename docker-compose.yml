services:
  db:
    image: mysql:8.0
    container_name: miestudio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: miestudio
      MYSQL_USER: miestudio
      MYSQL_PASSWORD: miestudio123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "miestudio", "-pmiestudio123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: miestudio_backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_DRIVER: "mysql"
      DB_USER: "miestudio"
      DB_PASSWORD: "miestudio123"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "miestudio"
      STORAGE_DIR: "/app/uploads"
      TZ: "${TZ:-America/Argentina/Buenos_Aires}"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://localhost,http://192.168.0.196:5173,http://192.168.0.196:8080"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.8-flash}"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: miestudio_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
