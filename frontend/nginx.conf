server {
    listen 80;
    server_name localhost;

    # Permitir subida de materiales/PDFs de hasta 50MB (coincidente con el límite del backend Fiber)
    client_max_body_size 50M;
    client_body_buffer_size 16M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para rendimiento de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy inverso transparente hacia el backend en Go
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts extendidos para subidas de archivos grandes
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Enrutamiento de Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para recursos estáticos versionados
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }
}
