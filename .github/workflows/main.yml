name: build-and-push
on:
    push:
        branches: ["develop", "main"]
        tags: ["v*"]

env:
    REGISTRY: ghcr.io
    OWNER: ${{ github.repository_owner }}
    BACKEND_STG: ghcr.io/${{ github.repository_owner }}/miestudio-backend-staging
    BACKEND_PROD: ghcr.io/${{ github.repository_owner }}/miestudio-backend
    FRONTEND_STG: ghcr.io/${{ github.repository_owner }}/miestudio-frontend-staging
    FRONTEND_PROD: ghcr.io/${{ github.repository_owner }}/miestudio-frontend

jobs:
    docker:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # STAGING (develop)
            - name: Build & Push BACKEND (staging)
              if: startsWith(github.ref, 'refs/heads/develop')
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  tags: |
                      ${{ env.BACKEND_STG }}:v0.0.0-rc.${{ github.run_number }}
                      ${{ env.BACKEND_STG }}:${{ github.sha }}
                      ${{ env.BACKEND_STG }}:latest

            - name: Build & Push FRONTEND (staging)
              if: startsWith(github.ref, 'refs/heads/develop')
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  push: true
                  tags: |
                      ${{ env.FRONTEND_STG }}:v0.0.0-rc.${{ github.run_number }}
                      ${{ env.FRONTEND_STG }}:${{ github.sha }}
                      ${{ env.FRONTEND_STG }}:latest

            # PROD (main o tag v*)
            - name: Build & Push BACKEND (prod)
              if: startsWith(github.ref,'refs/heads/main') || startsWith(github.ref,'refs/tags/v')
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  push: true
                  tags: |
                      ${{ env.BACKEND_PROD }}:${{ startsWith(github.ref,'refs/tags/v') && github.ref_name || 'latest' }}
                      ${{ env.BACKEND_PROD }}:${{ github.sha }}
                      ${{ env.BACKEND_PROD }}:latest

            - name: Build & Push FRONTEND (prod)
              if: startsWith(github.ref,'refs/heads/main') || startsWith(github.ref,'refs/tags/v')
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  push: true
                  tags: |
                      ${{ env.FRONTEND_PROD }}:${{ startsWith(github.ref,'refs/tags/v') && github.ref_name || 'latest' }}
                      ${{ env.FRONTEND_PROD }}:${{ github.sha }}
                      ${{ env.FRONTEND_PROD }}:latest

            # Disparar deploy en Dokploy
            - name: Trigger Dokploy deploy (staging)
              if: startsWith(github.ref, 'refs/heads/develop')
              run: curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_STG }}"

            - name: Trigger Dokploy deploy (prod)
              if: startsWith(github.ref,'refs/heads/main') || startsWith(github.ref,'refs/tags/v')
              run: curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_PROD }}"
